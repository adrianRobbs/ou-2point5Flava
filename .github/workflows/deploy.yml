      # - name: Trigger deploy — refresh-odds (daytime) cron
      #   run: |
      #     curl -f -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_REFRESH_DAYTIME_CRON_ID }}/deploys" \
      #       -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
      #       -H "Content-Type: application/json" \
      #       -d "{\"commitId\": \"${{ steps.commit.outputs.sha }}\"}"
      #
      # - name: Trigger deploy — refresh-odds (late) cron
